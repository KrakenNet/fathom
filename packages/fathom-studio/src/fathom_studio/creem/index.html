<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Fathom Policy Studio</title>
<link rel="stylesheet" href="/creem/creem-ds.css" />
<style>
  body.ds{ min-height:100vh; }
  .cs-shell{ min-height:100vh; display:flex; flex-direction:column; }

  /* topbar */
  .cs-top{ display:flex; align-items:center; gap:22px; padding:14px 26px; border-bottom:2px solid var(--ds-border); position:sticky; top:0; z-index:30; background:color-mix(in oklab,var(--ds-canvas) 88%,transparent); backdrop-filter:blur(10px); }
  .cs-brand{ display:flex; align-items:center; gap:9px; }
  .cs-brand b{ font-family:var(--ds-display); font-weight:800; font-size:17px; letter-spacing:-.03em; }
  .cs-brand-sub{ font-size:12px; color:var(--ds-ink-3); font-weight:600; border-left:1.5px solid var(--ds-border); padding-left:9px; white-space:nowrap; }
  .cs-nav{ display:flex; gap:3px; margin:0 auto; background:var(--ds-paper); border:1.5px solid var(--ds-border); border-radius:var(--ds-pill); padding:4px; }
  .cs-nav-item{ display:flex; align-items:center; gap:7px; border:0; background:transparent; color:var(--ds-ink-2); font-family:var(--ds-font); font-weight:700; font-size:13px; padding:7px 14px; border-radius:var(--ds-pill); cursor:pointer; white-space:nowrap; transition:.14s; }
  .cs-nav-item:hover{ color:var(--ds-ink); }
  .cs-nav-item.is-on{ background:var(--ds-accent); color:var(--ds-on-accent); }
  .cs-top-r{ display:flex; align-items:center; gap:10px; }
  .cs-env{ display:flex; align-items:center; gap:7px; font-size:12px; font-weight:600; color:var(--ds-ink-2); background:var(--ds-paper); border:1.5px solid var(--ds-border); border-radius:var(--ds-pill); padding:6px 12px; white-space:nowrap; }
  .cs-env-dot{ width:7px; height:7px; border-radius:50%; background:var(--ds-allow); }
  .cs-theme{ width:36px; height:36px; display:grid; place-items:center; border:1.5px solid var(--ds-border); background:var(--ds-paper); color:var(--ds-ink-2); border-radius:50%; cursor:pointer; }
  .cs-theme:hover{ color:var(--ds-accent); border-color:var(--ds-accent); }
  .cs-stage{ flex:1; overflow:auto; }
  .cs-stage-in{ padding:26px 26px 70px; }
  .cs-placeholder{ padding:60px 0; } .cs-placeholder .ds-eyebrow{ display:flex; margin-bottom:10px; }
  .cs-empty{ font-size:12.5px; color:var(--ds-ink-3); font-style:italic; }
  .cs-sub-h{ font-family:var(--ds-mono); font-size:10px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--ds-ink-3); margin:4px 0; }
  .cs-doc{ font-size:12.5px; color:var(--ds-ink-2); background:var(--ds-surface); border:1.5px solid var(--ds-border); border-radius:var(--ds-r-sm); padding:9px 12px; margin:0; }
  .cs-bool{ display:flex; align-items:center; gap:10px; } .cs-bool em{ font-style:normal; font-family:var(--ds-mono); font-size:12px; color:var(--ds-ink-2); }
  .cs-add-row{ align-self:flex-start; display:inline-flex; align-items:center; gap:6px; border:1.5px dashed var(--ds-border); background:transparent; color:var(--ds-ink-2); font-family:var(--ds-font); font-weight:700; font-size:12.5px; padding:8px 14px; border-radius:var(--ds-pill); cursor:pointer; }
  .cs-add-row:hover{ color:var(--ds-accent); border-color:var(--ds-accent); }

  /* modal + fields */
  .cs-scrim{ position:fixed; inset:0; z-index:80; background:color-mix(in oklab,#1a140a 55%,transparent); backdrop-filter:blur(3px); display:flex; align-items:flex-start; justify-content:center; padding:54px 20px; overflow:auto; }
  .cs-modal{ background:var(--ds-paper); border:2px solid var(--ds-border); border-radius:var(--ds-r-lg); width:min(460px,100%); box-shadow:var(--ds-hard-lg); }
  .cs-modal.is-wide{ width:min(820px,100%); }
  .cs-modal-head{ display:flex; align-items:flex-start; justify-content:space-between; gap:14px; padding:18px 20px; border-bottom:2px solid var(--ds-border); }
  .cs-modal-title{ font-family:var(--ds-display); font-weight:800; font-size:18px; letter-spacing:-.01em; }
  .cs-modal-sub{ font-size:12.5px; color:var(--ds-ink-2); margin-top:3px; }
  .cs-x{ width:32px; height:32px; display:grid; place-items:center; border:0; background:var(--ds-surface); color:var(--ds-ink-2); border-radius:50%; cursor:pointer; flex-shrink:0; }
  .cs-x:hover{ color:var(--ds-deny); }
  .cs-modal-body{ padding:18px 20px; display:flex; flex-direction:column; gap:13px; }
  .cs-modal-foot{ display:flex; justify-content:flex-end; gap:10px; padding:15px 20px; border-top:2px solid var(--ds-border); background:var(--ds-surface); border-radius:0 0 var(--ds-r-lg) var(--ds-r-lg); }
  .cs-field{ display:flex; flex-direction:column; gap:6px; } .cs-field.is-inline{ display:grid; grid-template-columns:120px 1fr; align-items:center; gap:12px; }
  .cs-field-l{ font-size:11px; font-weight:700; letter-spacing:.03em; text-transform:uppercase; color:var(--ds-ink-2); display:flex; gap:7px; align-items:center; }
  .cs-field-l em{ font-style:normal; font-family:var(--ds-mono); font-size:10px; color:var(--ds-ink-3); letter-spacing:0; }
  .cs-slider{ display:flex; align-items:center; gap:11px; } .cs-slider input[type=range]{ flex:1; accent-color:var(--ds-accent); } .cs-slider span{ font-family:var(--ds-mono); font-size:12px; font-weight:700; min-width:40px; text-align:right; }
  .cs-cfg-grid{ display:grid; grid-template-columns:1fr 1fr; gap:24px; } .cs-cfg-col{ display:flex; flex-direction:column; gap:12px; }
  .cs-chips{ display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
  .cs-chip{ display:inline-flex; align-items:center; gap:6px; background:var(--ds-accent-wash); color:var(--ds-accent); font-family:var(--ds-mono); font-size:12px; font-weight:600; padding:5px 6px 5px 11px; border-radius:8px; }
  .cs-chip button{ border:0; background:transparent; color:var(--ds-accent); display:grid; place-items:center; padding:2px; cursor:pointer; }
  .cs-chip-add{ display:inline-flex; align-items:center; gap:4px; } .cs-chip-add input{ background:var(--ds-surface); border:1.5px dashed var(--ds-border); border-radius:8px; padding:6px 10px; font-family:var(--ds-mono); font-size:12px; color:var(--ds-ink); width:120px; } .cs-chip-add input:focus{ outline:none; border-color:var(--ds-accent); }
  .cs-chip-add button{ width:28px; height:28px; display:grid; place-items:center; border:1.5px solid var(--ds-accent); background:var(--ds-accent-wash); color:var(--ds-accent); border-radius:8px; cursor:pointer; } .cs-chip-add button:disabled{ opacity:.4; border-color:var(--ds-border); color:var(--ds-ink-3); background:var(--ds-surface); }

  /* ===== Reasoning Bench ===== */
  .rb-bench{ display:grid; grid-template-columns:minmax(320px,0.82fr) 70px minmax(0,1.4fr); align-items:start; }
  .rb-sec{ margin-bottom:24px; } .rb-sec > .ds-eyebrow{ display:flex; margin-bottom:12px; }
  .rb-sec-head{ display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:12px; } .rb-sec-head .ds-eyebrow{ margin:0; }
  .rb-scn-rail{ display:flex; flex-wrap:wrap; gap:7px; }
  .rb-scn{ position:relative; display:flex; align-items:center; gap:6px; border:1.5px solid var(--ds-border); background:var(--ds-paper); color:var(--ds-ink-2); font-family:var(--ds-font); font-weight:600; font-size:12.5px; padding:8px 12px; border-radius:var(--ds-pill); cursor:pointer; transition:.12s; white-space:nowrap; }
  .rb-scn:hover{ transform:translate(-1px,-1px); box-shadow:var(--ds-hard-sm); }
  .rb-scn.is-on{ background:var(--ds-accent); border-color:var(--ds-border); color:var(--ds-on-accent); box-shadow:var(--ds-hard-sm); }
  .rb-scn-acts{ display:none; align-items:center; gap:3px; }
  .rb-scn:hover .rb-scn-acts, .rb-scn.is-on .rb-scn-acts{ display:flex; }
  .rb-scn-acts button{ border:0; background:transparent; color:inherit; opacity:.7; display:grid; place-items:center; padding:1px; cursor:pointer; } .rb-scn-acts button:hover{ opacity:1; }
  .rb-facts{ display:flex; flex-direction:column; gap:8px; }
  .rb-fact{ display:flex; align-items:center; gap:10px; padding:10px 12px; background:var(--ds-paper); border:1.5px solid var(--ds-border); border-radius:var(--ds-r-sm); box-shadow:var(--ds-hard-sm); }
  .rb-fact[data-t="agent"]{ background:color-mix(in oklab,var(--ds-lav) 22%,var(--ds-paper)); }
  .rb-fact[data-t="data_request"]{ background:color-mix(in oklab,var(--ds-peach) 24%,var(--ds-paper)); }
  .rb-fact[data-t="tool_call"]{ background:color-mix(in oklab,var(--ds-grass) 22%,var(--ds-paper)); }
  .rb-fact[data-t="phi_access"]{ background:color-mix(in oklab,var(--ds-accent) 16%,var(--ds-paper)); }
  .rb-fact .ds-tag{ background:var(--ds-paper); }
  [data-theme="dark"] .rb-fact[data-t]{ background:var(--ds-surface); }
  [data-theme="dark"] .rb-fact .ds-tag{ color:#16130C; border-color:transparent; }
  [data-theme="dark"] .rb-fact[data-t="agent"] .ds-tag{ background:var(--ds-lav); }
  [data-theme="dark"] .rb-fact[data-t="data_request"] .ds-tag{ background:var(--ds-peach); }
  [data-theme="dark"] .rb-fact[data-t="tool_call"] .ds-tag{ background:var(--ds-grass); }
  [data-theme="dark"] .rb-fact[data-t="phi_access"] .ds-tag{ background:var(--ds-accent); color:#fff; }
  .rb-fact-v{ font-size:13px; font-weight:600; color:var(--ds-ink); }
  .rb-fact-x{ margin-left:auto; border:0; background:transparent; color:var(--ds-ink); opacity:.5; display:grid; place-items:center; padding:3px; border-radius:6px; cursor:pointer; } .rb-fact-x:hover{ opacity:1; color:var(--ds-deny); }
  .rb-mem{ display:flex; flex-wrap:wrap; align-items:center; gap:5px 12px; margin-top:10px; padding:9px 13px; background:var(--ds-surface); border:1.5px dashed var(--ds-border); border-radius:var(--ds-r-sm); }
  .rb-mem-l{ font-family:var(--ds-mono); font-size:10px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--ds-ink-3); }
  .rb-mem-i{ font-family:var(--ds-mono); font-size:11px; color:var(--ds-ink-2); }
  .rb-yaml{ font-size:11.5px; background:var(--ds-paper); white-space:pre-wrap; word-break:break-word; }
  .rb-seam{ position:relative; align-self:stretch; display:flex; justify-content:center; padding-top:6px; min-height:240px; }
  .rb-seam-line{ position:absolute; top:64px; bottom:0; left:50%; border-left:2px dotted var(--ds-border); }
  .rb-engine{ position:sticky; top:84px; width:52px; height:52px; border-radius:15px; background:var(--ds-paper); border:2px solid var(--ds-border); color:var(--ds-ink-2); display:grid; place-items:center; z-index:2; box-shadow:var(--ds-hard-sm); }
  .rb-engine.is-done{ border-color:var(--ds-accent); color:var(--ds-accent); animation:rb-ping .55s ease-out; }
  @keyframes rb-ping{ 0%{ box-shadow:0 0 0 0 color-mix(in oklab,var(--ds-accent) 45%,transparent); transform:scale(1);} 40%{ transform:scale(1.1);} 100%{ box-shadow:0 0 0 12px color-mix(in oklab,var(--ds-accent) 0%,transparent); transform:scale(1);} }
  .rb-runbar{ display:flex; align-items:center; gap:16px; margin-bottom:20px; }
  .rb-runmeta{ font-size:13px; color:var(--ds-ink-3); font-weight:500; }
  .rb-empty{ padding:24px 0; max-width:46ch; } .rb-empty .ds-eyebrow{ display:flex; margin-bottom:12px; }
  .rb-verdict{ animation:rb-in .4s ease; } @keyframes rb-in{ from{ transform:translateY(8px);} to{ transform:none;} }
  .rb-verdict-line{ display:flex; align-items:baseline; gap:20px; flex-wrap:wrap; }
  .rb-word{ position:relative; font-size:60px; line-height:1; letter-spacing:-.04em; }
  .rb-scrib{ position:absolute; left:-1%; right:-1%; bottom:-.16em; width:102%; height:.32em; overflow:visible; }
  .rb-us{ font-family:var(--ds-font); font-size:18px; color:var(--ds-ink-3); font-weight:600; } .rb-us b{ font-size:30px; font-weight:800; color:var(--ds-ink); letter-spacing:-.03em; font-family:var(--ds-display); }
  .rb-reason{ font-size:19px; font-weight:500; color:var(--ds-ink); margin:18px 0 0; max-width:54ch; line-height:1.4; letter-spacing:-.01em; }
  .rb-vfoot{ display:flex; gap:20px; flex-wrap:wrap; margin-top:15px; font-size:13px; color:var(--ds-ink-2); } .rb-vfoot b{ color:var(--ds-ink); font-weight:800; }
  .rb-signed{ display:flex; align-items:center; gap:5px; color:var(--ds-accent); font-weight:700; }
  .rb-trace{ margin-top:32px; padding-top:22px; border-top:2px solid var(--ds-border); } .rb-trace .ds-eyebrow{ display:flex; margin-bottom:16px; }
  .rb-timeline{ position:relative; margin-left:5px; } .rb-timeline::before{ content:""; position:absolute; left:5px; top:6px; bottom:6px; width:2px; background:var(--ds-border); }
  .rb-node{ position:relative; padding:0 0 16px 26px; } .rb-node:last-child{ padding-bottom:0; }
  .rb-node-dot{ position:absolute; left:0; top:3px; width:12px; height:12px; border-radius:50%; background:var(--ds-canvas); border:2px solid var(--ds-border); z-index:1; }
  .rb-node:not(.is-fired){ opacity:.6; }
  .rb-node-line{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .rb-node-name{ font-family:var(--ds-mono); font-size:13px; font-weight:600; color:var(--ds-ink); } .rb-node.is-fired .rb-node-name{ font-weight:700; }
  .rb-node-mod{ font-size:11.5px; color:var(--ds-ink-3); } .rb-node-us{ font-family:var(--ds-mono); font-size:11px; color:var(--ds-ink-3); margin-left:auto; }
  .rb-skip{ font-size:11.5px; color:var(--ds-ink-3); font-style:italic; } .rb-node-why{ font-size:13px; color:var(--ds-ink-2); margin-top:5px; line-height:1.4; }

  /* ===== Live Wire ===== */
  .lw{ display:flex; flex-direction:column; gap:14px; }
  .lw-bar{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; } .lw-spacer{ flex:1; }
  .lw-read{ font-size:13px; color:var(--ds-ink-2); white-space:nowrap; } .lw-read b{ font-family:var(--ds-display); font-weight:800; color:var(--ds-ink); }
  .lw-gauge{ height:11px; min-width:130px; flex:0 1 200px; border:2px solid var(--ds-border); border-radius:var(--ds-pill); overflow:hidden; display:flex; background:var(--ds-paper); }
  .lw-gauge .d{ background:var(--ds-deny);} .lw-gauge .e{ background:var(--ds-escalate);} .lw-gauge .a{ background:var(--ds-allow);}
  .lw-mid{ display:grid; grid-template-columns:1.55fr 1fr; gap:14px; }
  .lw-stage{ height:300px; display:grid; grid-template-columns:84px 1fr 96px; background:var(--ds-paper); border:2px solid var(--ds-border); border-radius:var(--ds-r); box-shadow:var(--ds-hard-sm); overflow:hidden; }
  .lw-in{ border-right:2px dashed var(--ds-border); background:var(--ds-surface); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; }
  .lw-cap{ font-family:var(--ds-mono); font-size:10px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--ds-ink-3); } .lw-cap2{ font-family:var(--ds-mono); font-size:10px; color:var(--ds-ink-3); }
  .lw-pulse{ width:46px; height:46px; border-radius:50%; border:2px solid var(--ds-accent); background:var(--ds-accent-wash); }
  .lw-track{ position:relative; } .lw-glide{ position:absolute; left:0; right:0; border-top:2px dotted var(--ds-line-soft); } .lw-gl{ position:absolute; right:7px; transform:translateY(-50%); font-family:var(--ds-mono); font-size:9px; font-weight:700; color:var(--ds-ink-3); }
  .lw-core{ position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); width:56px; height:56px; border-radius:16px; background:var(--ds-ink); color:var(--ds-canvas); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1px; border:2px solid var(--ds-border); } .lw-core span{ font-family:var(--ds-display); font-size:8px; font-weight:700; }
  .lw-pkt{ position:absolute; left:-14px; top:50%; width:11px; height:11px; border-radius:50%; border:1.5px solid var(--ds-border); animation-name:lw-flight; animation-timing-function:cubic-bezier(.4,.1,.5,1); animation-fill-mode:forwards; }
  .lw-pkt.fx-deny{ background:var(--ds-deny);} .lw-pkt.fx-escalate{ background:var(--ds-escalate);} .lw-pkt.fx-allow{ background:var(--ds-allow);}
  @keyframes lw-flight{ 0%{ left:-14px; top:50%; opacity:0;} 8%{opacity:1;} 46%{ left:calc(50% - 6px); top:50%;} 54%{ left:calc(50% - 6px); top:var(--lane);} 92%{opacity:1;} 100%{ left:calc(100% + 14px); top:var(--lane); opacity:0;} }
  .lw-out{ border-left:2px dashed var(--ds-border); background:var(--ds-surface); display:flex; flex-direction:column; justify-content:center; gap:11px; padding:0 12px; }
  .lw-bin{ display:flex; align-items:center; gap:7px; } .lw-bin b{ font-family:var(--ds-display); font-weight:800; font-size:16px; } .lw-bin span{ font-size:9.5px; color:var(--ds-ink-2); font-weight:700; text-transform:uppercase; }
  .lw-feed{ background:var(--ds-paper); border:2px solid var(--ds-border); border-radius:var(--ds-r); box-shadow:var(--ds-hard-sm); display:flex; flex-direction:column; overflow:hidden; }
  .lw-feed-h{ font-family:var(--ds-mono); font-size:9.5px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--ds-ink-3); padding:10px 14px; border-bottom:2px solid var(--ds-border); display:flex; justify-content:space-between; }
  .lw-feed-list{ flex:1; overflow:auto; }
  .lw-frow{ display:flex; align-items:center; gap:10px; padding:9px 14px; border-bottom:1.5px dotted var(--ds-line-soft); animation:rb-in .3s ease; }
  .lw-ag{ font-family:var(--ds-mono); font-size:12px; font-weight:600; min-width:64px; } .lw-su{ font-family:var(--ds-mono); font-size:11px; color:var(--ds-ink-2); flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; } .lw-us{ font-family:var(--ds-mono); font-size:10.5px; color:var(--ds-ink-3); }
  .lw-sources{ display:flex; gap:9px; flex-wrap:wrap; align-items:center; padding:13px 16px; background:var(--ds-paper); border:2px solid var(--ds-border); border-radius:var(--ds-r); box-shadow:var(--ds-hard-sm); }
  .lw-src-h{ font-family:var(--ds-mono); font-size:9.5px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--ds-ink-3); margin-right:4px; }
  .lw-schip{ display:flex; align-items:center; gap:8px; padding:7px 12px; border:1.5px solid var(--ds-border); border-radius:var(--ds-r-sm); background:var(--ds-surface); }
  .lw-schip .nm{ font-family:var(--ds-mono); font-size:11px; font-weight:600; } .lw-schip .b{ height:7px; width:54px; border:1.5px solid var(--ds-border); border-radius:var(--ds-pill); overflow:hidden; background:var(--ds-paper); } .lw-schip .b i{ display:block; height:100%; } .lw-schip .v{ font-family:var(--ds-mono); font-size:10.5px; font-weight:700; }

  @media(max-width:980px){ .rb-bench{ grid-template-columns:1fr; } .rb-seam{ display:none; } .lw-mid{ grid-template-columns:1fr; } .cs-nav{ display:none; } }

  /* ===== editor (rule/template/pack) ===== */
  .re-grid{ display:grid; grid-template-columns:1fr 300px; gap:18px; }
  .re-form{ display:flex; flex-direction:column; gap:12px; min-width:0; }
  .re-row3{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:11px; }
  .re-toolbar{ display:flex; align-items:center; justify-content:space-between; gap:12px; background:var(--ds-surface); border:1.5px solid var(--ds-border); border-radius:var(--ds-r-sm); padding:8px 8px 8px 13px; font-size:12.5px; color:var(--ds-ink-2); }
  .re-cl{ font-family:var(--ds-mono); font-size:10px; font-weight:700; letter-spacing:.07em; text-transform:uppercase; color:var(--ds-ink-3); margin-top:4px; } .re-cl span{ text-transform:none; letter-spacing:0; }
  .re-cond{ background:var(--ds-surface); border:1.5px solid var(--ds-border); border-radius:var(--ds-r-sm); padding:11px; display:flex; flex-direction:column; gap:8px; }
  .re-cond-h{ display:flex; gap:8px; } .re-cond-h .ds-select{ flex:1; }
  .re-mini{ width:32px; height:32px; flex-shrink:0; display:grid; place-items:center; border:1.5px solid var(--ds-border); background:var(--ds-paper); border-radius:8px; color:var(--ds-ink-2); cursor:pointer; }
  .re-mini:hover{ border-color:var(--ds-accent); color:var(--ds-accent); } .re-mini.del:hover{ border-color:var(--ds-deny); color:var(--ds-deny); }
  .re-match{ display:grid; grid-template-columns:1fr 1.1fr 1fr auto; gap:7px; align-items:center; }
  .re-match .ds-input,.re-match .ds-select{ padding:7px 10px; font-size:12px; }
  .re-empty{ font-size:11.5px; color:var(--ds-ink-3); font-style:italic; }
