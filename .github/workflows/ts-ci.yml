name: ts-ci

# No path filter on pull_request: ts-test is a required status check for
# branch protection (dependabot auto-merge waits on it). A path-filtered
# required check never reports on non-matching PRs, which would block
# merging forever.
on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "packages/fathom-ts/**"
      - "packages/fathom-editor/**"
      - ".github/workflows/ts-ci.yml"
  workflow_dispatch: {}

concurrency:
  # Pull requests supersede: a new push to the branch cancels the run
  # it replaced. Pushes to main must not, because a merge commit can be
  # tagged for release and the release gate refuses to publish a commit
  # whose checks were cancelled. Merging three pull requests in a row
  # cancelled the test matrix on the commit v0.9.0 was cut from.
  # Keying a push on its own SHA gives every merge its own group.
  group: ts-ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

# CodeQL actions/missing-workflow-permissions: without an explicit block the
# GITHUB_TOKEN inherits the repository default, which can be write-all. These
# jobs only ever read the checkout.
permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4.0.3
        id: filter
        with:
          filters: |
            # True when the PR changes anything that isn't pure documentation.
            # Negation-only failure mode is safe: if dorny ignored the ``!`` patterns,
            # ``**`` matches everything → ``code`` stays true → jobs run anyway. They
            # only skip when every changed file is docs/markdown. ``docs`` (docs.yml)
            # is intentionally NOT gated — it must run on docs-only PRs.
            code:
              - '**'
              - '!**/*.md'
              - '!docs/**'
              - '!mkdocs.yml'
              - '!LICENSE'

  test:
    name: ts-test
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: packages/fathom-ts
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      # The pnpm lockfile lives in the package, not a workspace root, so
      # install from packages/fathom-ts (the working-directory default).
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run lint

      - name: Build
        run: pnpm run build

      - name: Test
        run: pnpm test

  # packages/fathom-editor is in dependabot's auto-merge scope but had no job
  # anywhere, so bumps to its vite/typescript/react tree landed on main
  # without ever being installed or built. Not a required check: it has no
  # tests, and this only asserts the tree still compiles.
  editor:
    name: editor-build
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: packages/fathom-editor
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      # Like fathom-ts, the lockfile lives in the package rather than a
      # workspace root.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `build` is `tsc && vite build`, so this typechecks as well as bundles.
      - name: Build
        run: pnpm run build
