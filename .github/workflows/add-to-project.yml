name: Add issues to project
on:
  issues:
    types: [opened, reopened]

# The action authenticates with ADD_TO_PROJECT_PAT, so the GITHUB_TOKEN needs
# nothing at all.
permissions: {}

jobs:
  add-to-project:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/add-to-project@v2.0.0
        with:
          project-url: https://github.com/orgs/KrakenNet/projects/29
          github-token: ${{ secrets.ADD_TO_PROJECT_PAT }}
