[project]
name = "fathom-rules"
version = "0.9.0"
description = "Deterministic reasoning runtime for AI agents, built on CLIPS via clipspy"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [
    { name = "Kraken Networks", email = "info@krakennetworks.com" },
]
keywords = [
    "expert-system",
    "rules-engine",
    "clips",
    "ai-agents",
    "deterministic",
    "compliance",
    "policy-engine",
    "guardrails",
    "owasp",
    "nist",
    "hipaa",
    "yaml",
    "mcp",
    "langchain",
    "symbolic-ai",
    "ai-safety",
]
classifiers = [
    # Beta, not Production/Stable: the covered surface is declared and gated
    # (VERSIONING.md, tests/test_public_surface.py) and the release path is
    # signed and reproducible, but the 1.0 readiness audit has not been done.
    # "5 - Production/Stable" is a claim about that audit, not about this work.
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Framework :: FastAPI",
    "Typing :: Typed",
]
# Every requirement a user can install -- these and every extra below --
# carries an upper bound. Without one a resolver may pull a future major
# into an environment this release was never tested against, and the break
# lands on the consumer's `pip install` instead of in this repo's CI. Each
# bound sits at the first major that has not been tested here; raising one
# is a deliberate change with a CI run behind it. `[dependency-groups] dev`
# is deliberately not bounded: it is never installed by a consumer, and its
# breakage surfaces in CI, where it belongs.
dependencies = [
    "clipspy>=1.0.6,<1.1",
    "pyyaml>=6.0,<7",
    "pydantic>=2.0,<3",
]

[project.urls]
Homepage = "https://krakn.ai"
Documentation = "https://fathom.krakn.ai"
Repository = "https://github.com/KrakenNet/fathom"
Changelog = "https://github.com/KrakenNet/fathom/blob/main/CHANGELOG.md"
Issues = "https://github.com/KrakenNet/fathom/issues"

[project.scripts]
fathom = "fathom.cli:app"

[project.optional-dependencies]
server = [
    "fastapi>=0.100,<1",
    "uvicorn>=0.20,<1",
]
mcp = [
    # Upper bound is real, not defensive: mcp 2.0 removed `mcp.server.fastmcp`,
    # which `fathom.integrations.mcp_server` imports. The floor is the fix for
    # GHSA-vj7q-gjh5-988w / GHSA-jpw9-pfvf-9f58 / GHSA-hvrp-rf83-w775.
    "mcp>=1.28.1,<2",
]
attestation = [
    "pyjwt[crypto]>=2.8,<3",
    "cryptography>=42.0,<51",
]
langchain = [
    "langchain-core>=0.2,<2",
]
crewai = [
    "crewai>=0.80,<2",
]
openai-agents = [
    "openai-agents>=0.1,<1",
]
google-adk = [
    "google-adk>=1.0,<3",
]
cli = [
    "typer[all]>=0.12,<1",
    "rich>=13,<15",
]
metrics = [
    "prometheus_client>=0.20,<1",
    "prometheus-fastapi-instrumentator>=7,<9",
]
grpc = [
    "grpcio>=1.60,<2",
    "grpcio-tools>=1.60,<2",
]
fleet = [
    "redis[hiredis]>=5,<8",
]
fleet-pg = [
    "asyncpg>=0.29,<1",
]
docs = [
    "mkdocs-material>=9.5,<10",
    "mkdocstrings[python]>=0.24,<2",
    "mkdocs-redirects>=1.2,<2",
    "mike>=2.1,<3",
    "pdoc>=14.0,<17",
    "mkdocs-swagger-ui-tag>=0.6,<1",
]
all = [
    "fathom-rules[server]",
    "fathom-rules[mcp]",
    "fathom-rules[attestation]",
    "fathom-rules[langchain]",
    "fathom-rules[crewai]",
    "fathom-rules[openai-agents]",
    "fathom-rules[google-adk]",
    "fathom-rules[cli]",
    "fathom-rules[metrics]",
    "fathom-rules[grpc]",
    "fathom-rules[fleet]",
    "fathom-rules[fleet-pg]",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov",
    "hypothesis>=6.0",
    "ruff",
    "mypy",
    "types-pyyaml>=6.0.12.20260408",
    "httpx>=0.24",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.24",
    "pytest-asyncio>=1.3.0",
    "typer[all]>=0.12",
    "rich>=13",
    "codespell>=2.2",
    "pre-commit>=3.5",
    "fathom-studio",
]

[tool.uv]
package = true

# crewai pins `json-repair==0.25.2`, which is GHSA-xf7x-x43h-rpqh. crewai is an
# optional extra whose adapter we exercise at import level only, so nothing here
# calls json-repair; override the pin rather than lock a known-vulnerable
# version into CI. Consumers installing `fathom-rules[crewai]` resolve crewai's
# own pin -- this override applies to this repo's lock, not to the wheel.
override-dependencies = ["json-repair>=0.60.1"]

[tool.uv.workspace]
members = ["packages/fathom-studio"]

[tool.uv.sources]
fathom-studio = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fathom"]

[project.entry-points."fathom.packs"]
owasp-agentic = "fathom.rule_packs.owasp_agentic"
ssvc = "fathom.rule_packs.ssvc"
nist-800-53 = "fathom.rule_packs.nist_800_53"
hipaa = "fathom.rule_packs.hipaa"
cmmc = "fathom.rule_packs.cmmc"

[tool.ruff]
target-version = "py312"
line-length = 99
src = ["src"]
extend-exclude = ["src/fathom/proto/fathom_pb2.py", "src/fathom/proto/fathom_pb2.pyi", "src/fathom/proto/fathom_pb2_grpc.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "SIM", "TCH"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = "clips.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "grpc.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "redis.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "fathom.proto.*"
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests", "packages/fathom-studio/tests"]
addopts = "--strict-markers -ra"
markers = [
    "integration: requires external service containers (Docker: redis:7-alpine, postgres:16-alpine)",
    "concurrency: multi-threaded stress test; slow and excludable",
]

[tool.coverage.run]
source = ["fathom"]

[tool.coverage.report]
show_missing = true
skip_empty = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.",
    "@overload",
]
