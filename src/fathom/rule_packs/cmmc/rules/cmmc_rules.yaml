module: cmmc
ruleset: cmmc-level2
version: "1.0"
# Salience convention: decision selection is last-write-wins and CLIPS fires
# the highest salience first, so the LOWEST-salience rule that fires decides.
# Severity is monotone in reverse salience here: deny 50, escalate >= 80.
rules:
  - name: ac-l2-authorized-access
    salience: 50
    when:
      - template: cui_policy
        conditions:
          - slot: justification
            expression: "equals()"
          - slot: action
            expression: "in([read, write, admin])"
    then:
      action: deny
      reason: "CUI access denied: authorized access justification required (AC.L2-3.1.1)"
      log: full
      attestation: true
      metadata:
        control: AC.L2-3.1.1
        framework: CMMC
        title: Authorized Access Control
        cmmc_practice: AC.L2-3.1.1
        cmmc_level: "2"

  - name: ac-l2-cui-flow
    salience: 50
    when:
      - template: data_transfer
        conditions:
          - slot: classification
            expression: "in([cui_basic, cui_specified, secret, top_secret])"
          - slot: destination
            expression: "matches(external|public|untrusted)"
    then:
      action: deny
      reason: "CUI transfer blocked: controlled information cannot flow to external destination (AC.L2-3.1.3)"
      log: full
      attestation: true
      metadata:
        control: AC.L2-3.1.3
        framework: CMMC
        title: CUI Flow Enforcement
        cmmc_practice: AC.L2-3.1.3
        cmmc_level: "2"

  - name: ac-l2-least-privilege
    salience: 50
    when:
      - template: cui_policy
        conditions:
          - slot: action
            expression: "in([admin, escalate, override, delete])"
          - slot: justification
            expression: "equals()"
    then:
      action: deny
      reason: "Privileged CUI action requires explicit justification (AC.L2-3.1.5)"
      log: full
      attestation: true
      metadata:
        control: AC.L2-3.1.5
        framework: CMMC
        title: Least Privilege
        cmmc_practice: AC.L2-3.1.5
        cmmc_level: "2"

  - name: au-l2-audit-records
    salience: 100
    when:
      - template: audit_event
        conditions:
          - slot: outcome
            expression: "equals(unknown)"
          - slot: event_type
            expression: "in([access, modify, delete, export])"
    then:
      action: escalate
      reason: "Audit record incomplete: outcome must be recorded for CUI events (AU.L2-3.3.1)"
      log: full
      attestation: true
      metadata:
        control: AU.L2-3.3.1
        framework: CMMC
        title: System Audit Records
        cmmc_practice: AU.L2-3.3.1
        cmmc_level: "2"

  - name: au-l2-traceability
    salience: 50
    when:
      - template: audit_event
        conditions:
          - slot: subject
            expression: "equals()"
          - slot: event_type
            expression: "in([access, modify, delete, export])"
    then:
      action: deny
      reason: "Audit traceability failed: subject identity required for all CUI actions (AU.L2-3.3.2)"
      log: full
      attestation: true
      metadata:
        control: AU.L2-3.3.2
        framework: CMMC
        title: Audit Traceability
        cmmc_practice: AU.L2-3.3.2
        cmmc_level: "2"

  # Threshold control: more than 20 CUI reads within 600 seconds. Expressed as
  # a rate_exceeds condition on the ts slot -- the only form the compiler
  # implements; a sibling `temporal:` mapping is silently ignored.
  - name: ir-l2-incident-handling
    salience: 200
    when:
      - template: cui_policy
        conditions:
          - slot: action
            expression: "equals(read)"
          - slot: ts
            expression: "rate_exceeds(cui_policy, action, read, 20, 600, ts)"
    then:
      action: escalate
      reason: "Bulk CUI access detected: more than 20 reads in 600s, incident handling evaluation required (IR.L2-3.6.1)"
      log: full
      attestation: true
      metadata:
        control: IR.L2-3.6.1
        framework: CMMC
        title: Incident Handling
        cmmc_practice: IR.L2-3.6.1
        cmmc_level: "2"
        threshold: "20"
        window_seconds: "600"
