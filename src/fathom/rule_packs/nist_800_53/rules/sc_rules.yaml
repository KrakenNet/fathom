module: nist
ruleset: nist-800-53-sc
version: "1.0"
# Salience convention: decision selection is last-write-wins and CLIPS fires
# the highest salience first, so the LOWEST-salience rule that fires decides.
# Severity is monotone in reverse salience here: deny 50, escalate >= 80.
rules:
  - name: boundary-protection
    salience: 50
    when:
      - template: data_transfer
        conditions:
          - slot: destination
            expression: "matches(external|public|untrusted|dmz)"
          - slot: protocol
            expression: "in([unknown, plaintext, ftp, telnet])"
    then:
      action: deny
      reason: "Data transfer to external boundary requires secure protocol (SC-7)"
      log: full
      attestation: true
      metadata:
        control: SC-7
        framework: NIST-800-53
        title: Boundary Protection

  - name: transmission-confidentiality
    salience: 50
    when:
      - template: data_transfer
        conditions:
          - slot: classification
            expression: "in([secret, top_secret, confidential])"
          - slot: protocol
            expression: "in([unknown, plaintext, ftp, telnet])"
    then:
      action: deny
      reason: "Classified data requires secure transmission protocol (SC-8)"
      log: full
      attestation: true
      metadata:
        control: SC-8
        framework: NIST-800-53
        title: Transmission Confidentiality and Integrity
