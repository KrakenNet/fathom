module: nist
ruleset: nist-800-53-ac
version: "1.0"
# Salience convention: decision selection is last-write-wins and CLIPS fires
# the highest salience first, so the LOWEST-salience rule that fires decides.
# Severity is monotone in reverse salience here: deny 50, escalate >= 80.
rules:
  - name: access-enforcement
    salience: 50
    when:
      - template: access_request
        conditions:
          - slot: clearance
            expression: "equals(unclassified)"
          # Word-boundary, case-insensitive: matches secret_docs, TOP_SECRET_docs
          # and classified-doc without false-denying unclassified_notes.
          - slot: resource
            expression: "matches((?i)(^|[^a-z])(classified|restricted|secret)([^a-z]|$))"
    then:
      action: deny
      reason: "Access denied: subject clearance insufficient for resource (AC-3)"
      log: full
      attestation: true
      metadata:
        control: AC-3
        framework: NIST-800-53
        title: Access Enforcement

  - name: info-flow-enforcement
    salience: 50
    when:
      - template: data_transfer
        conditions:
          - slot: classification
            expression: "in([secret, top_secret, confidential])"
          - slot: destination
            expression: "matches(external|public|untrusted)"
    then:
      action: deny
      reason: "Data transfer blocked: classified data cannot flow to external destination (AC-4)"
      log: full
      attestation: true
      metadata:
        control: AC-4
        framework: NIST-800-53
        title: Information Flow Enforcement

  - name: least-privilege
    salience: 50
    when:
      - template: access_request
        conditions:
          - slot: action
            expression: "in([admin, escalate, override, delete])"
          - slot: context
            expression: "equals()"
    then:
      action: deny
      reason: "Privileged action requires explicit context justification (AC-6)"
      log: full
      attestation: true
      metadata:
        control: AC-6
        framework: NIST-800-53
        title: Least Privilege

  - name: remote-access
    salience: 100
    when:
      - template: access_request
        conditions:
          - slot: context
            expression: "matches(remote|vpn|external)"
          - slot: action
            expression: "in([admin, escalate, override])"
    then:
      action: escalate
      reason: "Remote privileged access requires additional authorization (AC-17)"
      log: full
      attestation: true
      metadata:
        control: AC-17
        framework: NIST-800-53
        title: Remote Access
