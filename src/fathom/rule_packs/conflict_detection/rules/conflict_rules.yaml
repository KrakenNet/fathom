module: conflict_detection
ruleset: conflict-detection
version: "1.0"
# Detection only. Every rule here asserts a `conflict` and renders no
# decision, because what to do about a contradiction is a policy question
# and this pack does not have the policy.
#
# Nothing runs inside an assert. The host asserts its claims and then calls
# `evaluate()`; a `subscribe` listener fires synchronously inside
# `assert_fact`, so asserting a conflict from one would re-enter the fact
# manager mid-assert.
#
# Each rule pairs two claims in exactly one order, so a conflict is reported
# once rather than twice. The ordering comes from the declaration for the
# first and third rules (`tail_a` before `tail_b`, `broader` before
# `narrower`) and from `str-compare` for the second, which has no declaration
# to order it.
rules:
  # Two claims about one head that name tails a declaration says cannot
  # both hold.
  - name: detect-mutual-exclusion
    salience: 100
    when:
      - template: mutual_exclusion
        alias: $m
        conditions: []
      - template: claim
        alias: $a
        conditions:
          - slot: relation
            expression: "equals($m.relation)"
          - slot: tail
            expression: "equals($m.tail_a)"
      - template: claim
        alias: $b
        conditions:
          - slot: head
            expression: "equals($a.head)"
          - slot: relation
            expression: "equals($m.relation)"
          - slot: tail
            expression: "equals($m.tail_b)"
    then:
      assert:
        - template: conflict
          slots:
            kind: mutual_exclusion
            head: "?a-head"
            relation: "?m-relation"
            tail_a: "?m-tail_a"
            tail_b: "?m-tail_b"

  # Two different tails for one (head, relation), observed within an hour of
  # each other. Far apart in time the pair is a legitimate change -- someone
  # moved, a status was updated -- and only closeness makes it a
  # contradiction, which is why the gap is the whole test.
  #
  # The gap is between the two claims, not between each claim and now. Asking
  # `changed_within(3600)` of both measured recency instead: two claims ten
  # seconds apart went undetected once they were a day old, a pair fifty
  # minutes apart was missed whenever it straddled the hour boundary, and the
  # same working memory answered differently depending on when it was asked.
  - name: detect-temporal-conflict
    salience: 90
    when:
      - template: claim
        alias: $a
        conditions:
          - slot: observed_at
            bind: "?a-observed_at"
          - slot: tail
            bind: "?a-tail"
      - template: claim
        alias: $b
        conditions:
          - slot: head
            expression: "equals($a.head)"
          - slot: relation
            expression: "equals($a.relation)"
          - slot: observed_at
            bind: "?b-observed_at"
          - slot: tail
            bind: "?b-tail"
          # Orders the pair, and rejects a claim against itself. Without it
          # every conflict is found twice, once per assignment.
          - test: "(< (str-compare ?a-tail ?b-tail) 0)"
          # An unstamped claim defaults to 0.0 and must not pair with
          # anything: absence of a timestamp is not evidence of closeness.
          - test: "(and (> ?a-observed_at 0.0) (> ?b-observed_at 0.0))"
          - test: "(< (abs (- ?a-observed_at ?b-observed_at)) 3600)"
    then:
      assert:
        - template: conflict
          slots:
            kind: temporal
            head: "?a-head"
            relation: "?a-relation"
            tail_a: "?a-tail"
            tail_b: "?b-tail"

  # Two claims that disagree only about how coarse they are.
  - name: detect-granularity-conflict
    salience: 80
    when:
      - template: subsumes
        alias: $g
        conditions: []
      - template: claim
        alias: $a
        conditions:
          - slot: relation
            expression: "equals($g.relation)"
          - slot: tail
            expression: "equals($g.broader)"
      - template: claim
        alias: $b
        conditions:
          - slot: head
            expression: "equals($a.head)"
          - slot: relation
            expression: "equals($g.relation)"
          - slot: tail
            expression: "equals($g.narrower)"
    then:
      assert:
        - template: conflict
          slots:
            kind: granularity
            head: "?a-head"
            relation: "?g-relation"
            tail_a: "?g-broader"
            tail_b: "?g-narrower"
