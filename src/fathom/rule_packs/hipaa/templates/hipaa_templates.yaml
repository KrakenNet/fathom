templates:
  - name: phi_policy
    slots:
      - name: resource
        type: symbol
        required: true
      - name: role
        type: symbol
        required: true
      - name: access_level
        type: symbol
        allowed_values: [read, write, admin]
        default: read
      - name: justification
        type: string
        default: ""
      - name: ts
        type: float
        required: true

  - name: data_transfer
    slots:
      - name: source
        type: symbol
        required: true
      - name: destination
        type: symbol
        required: true
      - name: data_type
        type: symbol
        default: phi
      - name: encrypted
        type: string
        default: "FALSE"
