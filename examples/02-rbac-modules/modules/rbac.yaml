modules:
  - name: role_permits
    description: "Role-based grants, evaluated first"
  - name: deny_checks
    description: "Hard denies — guests, confidential data — evaluated last so they win"

# focus_order is execution order: the engine drains role_permits' agenda, then
# deny_checks'. Both modules always run; CLIPS does not short-circuit.
#
# deny_checks is listed LAST on purpose. The evaluator is last-write-wins, so
# the module that runs last is the module whose decision the caller sees --
# which for a guardrail module is the only ordering that makes it a guardrail.
focus_order:
  - role_permits
  - deny_checks
